name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  validate:
    if: github.repository == 'hyperupcall-projects/npm-package-json-lint-config'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Verify release tag and branch
        id: release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@hyperupcall/npm-package-json-lint-config');
          assert.notEqual(pkg.private, true);
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);

          const tag = pkg.version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${tag}\n`);
          NODE

      # Reads the pinned pnpm version from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false
          cache: false

      - run: pnpm install --frozen-lockfile

      # Invoke tools directly until scripts-nodejs propagates exit codes.
      - name: Check formatting and lint
        run: |
          node_modules/@hyperupcall/scripts-nodejs/node_modules/.bin/prettier --check --ignore-unknown .
          node_modules/@hyperupcall/scripts-nodejs/node_modules/.bin/eslint .

      - name: Pack and verify package contents
        id: pack
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, renameSync } from 'node:fs';
          import { join } from 'node:path';

          const dir = process.env.RUNNER_TEMP;
          const [pkg] = JSON.parse(readFileSync(join(dir, 'pack.json'), 'utf8'));

          assert.deepEqual(pkg.files.map(file => file.path).sort(), [
            'LICENSE',
            'README.md',
            'index.cjs',
            'npmpackagejsonlint.config.js',
            'package.json',
          ].sort());

          renameSync(join(dir, pkg.filename), join(dir, 'package.tgz'));
          NODE

          printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/package.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Test the packed package in a clean consumer
        run: |
          consumer_dir=$(mktemp -d)
          cd "$consumer_dir"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/package.tgz"

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import config from '@hyperupcall/npm-package-json-lint-config';

          const require = createRequire(import.meta.url);
          assert.strictEqual(require('@hyperupcall/npm-package-json-lint-config'), config);
          assert.equal(config.rules['require-name'], 'error');
          assert.equal(config.rules['require-version'], 'error');

          console.log('Packed package loads through both import and require.');
          NODE

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: Publish
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-release

      - name: Verify and stage the validated tarball
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
          DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: |
          tarball="$RUNNER_TEMP/npm-release/package.tgz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$tarball" | sha256sum --check
          npm stage publish "$tarball" --access public --tag "$DIST_TAG" --ignore-scripts
